# Verdict bands: percentile -> word. Versioned and loaded as data, like a
# metric definition (metrics/*.yaml), so a report records which ruleset
# wrote its claims and a change to the wording is a reviewable diff rather
# than an edit buried in a renderer.
#
# Lives outside metrics/ on purpose: definitions.load_all() globs
# metrics/*.yaml and would try to read this as a MetricDefinition.
id: verdict_bands
version: 1
methodology: docs/verdict_bands.md

# How far from the positional median a value must sit before it earns a
# sentence, in median absolute deviations. Part of the versioned ruleset
# because it decides what a report asserts just as much as the bands do:
# without it, rank noise on a seven-player comparison set becomes a
# verdict (Xhaka's 1.22 key passes per 90 against a median of 1.26 read
# as "below par"). A report stamps band_version, so raising this has to
# be a version bump and a visible diff, not an edit to a constant.
notable_distance_mads: 1.0

# Ordered high to low. The first band whose min_percentile the value meets
# or exceeds wins, so boundaries are inclusive at the bottom: exactly 90
# reads elite, 89 reads strong.
#
# direction decides which list a claim can be selected into. "neutral"
# metrics are never surfaced as prose — a report that asserts a player is
# average at something is padding.
bands:
  - verdict: elite
    min_percentile: 90
    direction: strength
  - verdict: strong
    min_percentile: 75
    direction: strength
  - verdict: typical
    min_percentile: 40
    direction: neutral
  - verdict: below par
    min_percentile: 15
    direction: weakness
  - verdict: weak
    min_percentile: 0
    direction: weakness
